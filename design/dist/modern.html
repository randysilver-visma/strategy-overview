<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}body{margin:0}</style>
<title>Starling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: header with wordmark and tabs; six views (Overview, Strategy, Work, Decisions, Open questions, Review);
   one side drawer for records and initiative lists. Every colour comes from the skin's tokens. */
/* Brand colours: Sunflower Gold F9AE21, Gunmetal 434343, Sweet Peony E36397, Icy Blue A3D9FF, plus black.
   Status colours (ok, warn, bad) sit outside the brand palette because they carry meaning.
   Violet marks unfunded work. The three column tints separate goals, opportunities and initiatives on the strategy board. */
:root{
  --bg:#fafafa; --surface:#ffffff; --surface2:#f2f2f2; --fg:#111111; --muted:#5a5a5a; --line:#e3e3e3;
  --accent:#111111; --accent-fg:#ffffff; --accent-soft:#fdf1d6;
  --star:#F9AE21; --ink:#111111; --note-a:#F9AE21; --note-b:#E36397; --note-c:#A3D9FF;
  --ok:#0f8a4f; --ok-soft:#dff5e9; --warn:#b97f00; --warn-line:#F5B82E; --warn-soft:#fdf0d0; --bad:#d12e2e; --bad-soft:#fde4e2;
  --hyp:#434343; --hyp-soft:#ececec;
  --violet:#6a4fd6; --violet-soft:#ece8fb;
  --col-goal:#e7eaee; --col-opp:#ebe9f1; --col-init:#e5ede7;
  --bar-dark:#111111; --bar-dark-fg:#ffffff; --track:#e4e4e4;
  --g-goal:#F9AE21; --g-res:#434343; --g-disc:#E36397; --g-delay:#A3D9FF;
  --wire:#c9c9c9; --wire-on:#111111;
  --font-display:"Geist",system-ui,sans-serif; --font-body:"Geist",system-ui,sans-serif; --font-mono:"Geist Mono",ui-monospace,monospace; --font-hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#161616; --surface2:#1e1e1e; --fg:#f5f5f5; --muted:#a3a3a3; --line:#2a2a2a;
  --accent:#F9AE21; --accent-fg:#111111; --accent-soft:#2f2610;
  --ok:#4ade80; --ok-soft:#10301d; --warn:#fbbf24; --warn-line:#d99a12; --warn-soft:#352706; --bad:#f87171; --bad-soft:#3a1717; --hyp:#c9c9c9; --hyp-soft:#2a2a2a;
  --violet:#a994ff; --violet-soft:#241d40;
  --col-goal:#1b1e22; --col-opp:#1e1c24; --col-init:#1a211c;
  --bar-dark:#f0f0f0; --bar-dark-fg:#111111; --track:#2a2a2a;
  --g-res:#7a7a7a; --wire:#3a3a3a; --wire-on:#f5f5f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#161616; --surface2:#1e1e1e; --fg:#f5f5f5; --muted:#a3a3a3; --line:#2a2a2a;
  --accent:#F9AE21; --accent-fg:#111111; --accent-soft:#2f2610;
  --ok:#4ade80; --ok-soft:#10301d; --warn:#fbbf24; --warn-line:#d99a12; --warn-soft:#352706; --bad:#f87171; --bad-soft:#3a1717; --hyp:#c9c9c9; --hyp-soft:#2a2a2a;
  --violet:#a994ff; --violet-soft:#241d40;
  --col-goal:#1b1e22; --col-opp:#1e1c24; --col-init:#1a211c;
  --bar-dark:#f0f0f0; --bar-dark-fg:#111111; --track:#2a2a2a;
  --g-res:#7a7a7a; --wire:#3a3a3a; --wire-on:#f5f5f5; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1210px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--bar-dark);color:var(--bar-dark-fg);border-color:var(--bar-dark)}
.lnk{background:none;border:0;padding:0;text-align:left;color:inherit;font-weight:inherit}
.lnk:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--surface2);color:var(--fg)}
.pill.amber{background:var(--warn-line);color:#111}
.pill.soft{background:var(--accent-soft);color:var(--fg)}
.pill.out{background:transparent;border:1px solid var(--fg)}
.pill.dash{background:transparent;border:1px dashed var(--muted);color:var(--muted);border-radius:4px}
.pill.box{background:transparent;border:1px solid var(--bad);color:var(--fg);border-radius:4px}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.amb{color:var(--warn)} .red{color:var(--bad)} .vio{color:var(--violet)} .grn{color:var(--ok)}

/* header */
header.top{padding:20px 0 14px;border-bottom:1px solid var(--line)}
.top-row{display:flex;gap:16px 28px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.proto{font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:0;background:var(--accent-soft);border:1px solid var(--warn-line);padding:0 8px;border-radius:99px}
.sub{color:var(--muted);font-size:12.5px}
.hdr-actions{display:flex;gap:8px;margin-top:12px}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:14px}
nav.tabs a{padding:8px 12px;color:var(--fg);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
nav.tabs a:hover{background:var(--surface2);border-radius:8px 8px 0 0}
nav.tabs a[aria-current="page"]{border-bottom-color:var(--fg);font-weight:600}
nav.tabs .n{font-family:var(--font-mono);font-size:10.5px;background:var(--surface2);padding:0 6px;border-radius:4px;font-weight:600}

.view{padding-top:26px}
.view>h2{font-size:26px;margin-bottom:6px}
.lede{color:var(--muted);max-width:66ch;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card+.card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px}
.card-h h3{font-size:16px}
.num{width:22px;height:22px;border-radius:50%;background:var(--bar-dark);color:var(--bar-dark-fg);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.card-sub{color:var(--muted);font-size:12.5px;margin:2px 0 12px 32px}
.finding{padding:11px 14px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.finding.bad{background:var(--bad-soft)}
.finding b{white-space:nowrap}
.findings{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.scroll{overflow-x:auto}

/* overview */
.banner{background:var(--warn-soft);border-top:1px solid var(--warn-line);border-bottom:1px solid var(--warn-line);padding:14px 0;margin:18px 0 0}
.banner-in{display:flex;gap:12px;max-width:1210px;margin:0 auto}
.banner p{max-width:96ch;font-size:13px}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--warn)}
.hero{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.hero-text{padding:34px 34px 30px;display:flex;flex-direction:column;gap:14px}
.hero-text h2{font-size:clamp(28px,4vw,42px);line-height:1.05;letter-spacing:-.03em}
.hero-text p{color:var(--muted);max-width:110ch}
.northstar{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.northstar svg{flex:none;width:20px;height:20px;color:var(--star);margin-top:2px}
.northstar b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.northstar span{font-weight:500}
.sky{position:relative;height:280px;background:radial-gradient(55% 70% at 88% 18%,color-mix(in srgb,var(--star) 24%,transparent),transparent 70%),var(--surface2)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.starbig{position:absolute;right:48px;top:14px;width:86px;height:86px;color:var(--star);filter:drop-shadow(0 0 26px var(--star))}
.skycap{position:absolute;left:22px;top:14px;font-size:11.5px;color:var(--muted)}
.ragkey{position:absolute;left:22px;bottom:14px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.ragkey i{display:block;width:120px;height:7px;border-radius:99px;background:linear-gradient(90deg,hsl(142 55% 40%),hsl(43 95% 52%),hsl(3 78% 50%))}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px;padding:18px 32px 26px}
.lvl{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
.lvl .bar{height:7px;border-radius:99px;background:var(--rag,var(--track))}
.lvl b{font-size:14.5px}
.lvl small{color:var(--muted);font-size:12.5px}
.lvl:hover b{text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;font:inherit;color:inherit}
.tile.att{border-top-color:var(--warn-line)}
.tile b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.15}
.tile span{color:var(--muted);font-size:12.5px}
button.tile:hover{background:var(--surface2)}

/* strategy: north star bar, legend, five-column board */
.nsbar{background:var(--bar-dark);color:var(--bar-dark-fg);border-radius:14px;padding:11px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.nsbar .label{color:inherit;opacity:.8}
.nsbar .lnk{text-decoration:underline;font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--muted);margin:10px 0}
.legend .sp{flex:1}
.lg{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--muted)}
.sw.on{border-color:var(--ok)} .sw.risk{border-color:var(--warn-line)} .sw.na{border-style:dashed}
.sw.dot{width:8px;height:8px;border-radius:50%;border:0;background:var(--ok)}
.sw.opp{border:1.5px dashed var(--fg);border-radius:3px}
.sw.ng{border:1px solid var(--line);border-radius:50%;background:var(--surface2)}
.by{font-family:var(--font-mono);font-size:10px;font-weight:600;background:var(--accent-soft);padding:0 5px;border-radius:4px;white-space:nowrap;color:var(--fg)}
.by.none{background:var(--warn-soft);color:var(--warn)}
.boardwrap{overflow-x:auto;border-radius:18px}
.board{position:relative;min-width:1080px;display:grid;grid-template-columns:180px 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:0 12px 12px 12px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1}
.wires path.on{stroke:var(--wire-on);stroke-width:1.6}
.ocol{display:flex;flex-direction:column;gap:8px;padding-right:22px}
.colh{padding:12px 10px 10px;min-height:48px}
.colh b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.colh small{font-size:10.5px;color:var(--muted)}
.rows{display:grid;grid-template-columns:minmax(230px,1.15fr) minmax(230px,1.2fr) minmax(220px,1.1fr) minmax(130px,.62fr);column-gap:0}
.rows>.c-goal{background:var(--col-goal)} .rows>.c-opp{background:var(--col-opp)} .rows>.c-init{background:var(--col-init)}
.rows>.c-strat{padding:10px 22px 10px 0}
.rows>.c-goal,.rows>.c-opp,.rows>.c-init{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;justify-content:center}
.rows>.c-goal.colh,.rows>.c-opp.colh,.rows>.c-init.colh{border-top:0;border-radius:12px 12px 0 0;justify-content:flex-start}
.rows>.c-strat.sblock{display:flex;align-items:center}
.box{position:relative;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0;transition:opacity .15s}
.box:hover{border-color:var(--muted)}
.box.sel{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.box.dim{opacity:.32}
.obj b{display:block;font-weight:500;font-size:13px}
.obj small{color:var(--muted);font-size:11px}
.strat{width:100%;border-width:2px}
.strat.on{border-color:var(--ok)} .strat.risk{border-color:var(--warn-line)} .strat.na{border-style:dashed;border-color:var(--muted)}
.strat-t{display:flex;align-items:center;gap:8px;font-weight:500}
.chev{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.chev svg{width:12px;height:12px;transition:transform .15s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.strat small,.goal small,.oppc small,.grp small{display:block;color:var(--muted);font-size:11.5px}
.meas{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:var(--muted);margin-top:4px}
.meas strong{color:var(--fg);font-weight:500}
.sumc{font-size:13px;color:var(--muted)} .sumc b{color:var(--fg)}
.goal-t{display:flex;gap:6px;align-items:center;font-weight:500;font-size:13px}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--track);flex:none}
.gdot.m{background:var(--ok)}
.goal.nog{background:transparent;border-style:dashed}
.oppc{border:1.5px dashed var(--fg);background:var(--surface)}
.oppc.selc{background:var(--accent-soft)}
.oppc b{font-weight:500;font-size:12.5px;display:block}
.grp b{font-size:14px}
.grp.zero{border-color:var(--bad)} .grp.zero b,.grp.zero small{color:var(--bad)}
.grp .btn{margin-top:4px}
.hint{font-size:12.5px;color:var(--muted);margin:12px 0}
details.dstack{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.dstack summary{cursor:pointer;font-weight:500;font-size:15px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px 6px 0;vertical-align:bottom}
td{padding:8px 10px 8px 0;border-top:1px solid var(--line);vertical-align:top}

/* work: quarter grid */
.ctrls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:500}
.seg.sm button{padding:5px 11px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--bar-dark);color:var(--bar-dark-fg)}
.ctrls .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.rg{min-width:900px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rr{display:grid;grid-template-columns:220px repeat(5,minmax(0,1fr));border-top:1px solid var(--line);position:relative}
.rr.hd{border-top:0;background:var(--surface2);font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.rr.hd>div{padding:10px;text-align:center}
.rr.hd>div:first-child{text-align:left}
.rr.srow{background:var(--accent-soft)}
.rr .rl{padding:10px 12px;font-size:12px;color:var(--muted);min-width:0;grid-column:1}
.rr .rl b{color:var(--fg);font-size:14px;font-weight:600}
.rr .rl .t{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.rr.srow .qc{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid color-mix(in srgb,var(--fg) 6%,transparent);padding:10px 4px;position:relative}
.qc b{font-size:19px;display:flex;gap:6px;align-items:center}
.qc b .vio{font-size:15px}
.qc span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dia{display:inline-block;width:11px;height:11px;background:var(--fg);transform:rotate(45deg)}
.later{position:absolute;right:8px;bottom:6px;font-size:10.5px;color:var(--muted)}
.rr.grow .rl{padding-left:34px}
.rr.irow .rl{padding-left:46px;font-size:11.5px}
.rr.irow .rl b{font-size:12.5px;font-weight:500}
.bars{grid-column:2/7;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;row-gap:4px;padding:8px 0}
.gb{height:24px;border-radius:3px;background:var(--g-goal);color:#111;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin:0 4px;min-width:0;overflow:hidden;white-space:nowrap}
.gb .dia{background:#111}
.mini{height:10px;border-radius:2px;margin:0 4px}
.mini.r{background:var(--g-res)} .mini.d{background:var(--g-disc)} .mini.e{background:var(--g-delay)}
.ib{height:18px;border-radius:3px;margin:0 4px;background:var(--bar-dark)}
.ib.unf{background:var(--violet-soft);border:1.5px solid var(--violet)}
.ib.nr{background:transparent;border:1.5px dashed var(--muted)}
.lgrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin-bottom:8px;align-items:center}
.lgrow .k{display:inline-block;width:20px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px}
table.ft td.n,table.ft th.n{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
table.ft tr.grp-r td{font-weight:600;background:var(--surface2)}
table.ft tr.grp-r td:first-child{padding-left:8px}

/* decisions */
.callout{border-left:3px solid var(--warn-line);background:var(--warn-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:14px;font-size:13px}
.pq{font-weight:600;font-size:15px;max-width:72ch;margin:4px 0 8px}
.pbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.pbar .tr{height:10px;border-radius:99px;background:var(--track);position:relative;overflow:hidden}
.pbar .tr i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--muted)}
.pbar.hl b{font-weight:600}
.pbar.hl .tr i{background:var(--bar-dark)}
.pbar .v{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.below{border-top:2px dashed var(--muted);margin-top:10px;padding:10px 12px;background:var(--surface2);border-radius:0 0 10px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.scol{border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.scol h4{font-size:16px}
.proxy{border:1.5px dashed var(--warn-line);border-radius:10px;padding:10px 12px;margin:12px 0;display:flex;flex-direction:column;gap:8px;font-size:12.5px}
.proxy small{display:block;color:var(--muted)}
.ogh{margin-top:14px;padding-top:4px}
.ogh .label{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ogh b{display:block;font-size:13.5px;margin-top:2px}
.ini{border-top:1px solid var(--line);padding:9px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px}
.ini .nm{font-weight:600;font-size:13px}
.ini .ln{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;color:var(--muted)}
.ini select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--surface);color:var(--fg)}
.ini.changed{background:color-mix(in srgb,var(--warn-line) 12%,transparent);border-radius:8px;padding-inline:8px}
.impact{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.impact .tile{border-top-color:var(--line)}
.olist .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;font-size:13px}

/* open questions */
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.note{padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note .k{font-family:var(--font-mono);font-size:11.5px;display:flex;gap:10px}
.note h3{font-size:18px;letter-spacing:-.01em}
.note small{font-size:12.5px}

/* review */
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qitem+.qitem{margin-top:8px}
.qitem>div{min-width:0}
.qitem .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.qitem b{display:block;font-size:14.5px;margin:3px 0 2px}
.diff{font-size:12.5px}
.diff del{color:var(--bad)} .diff ins{color:var(--ok);text-decoration:none}
.qitem.mc{background:var(--warn-soft);display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.qitem.mc b{margin:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(560px,100%);z-index:31;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.18);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.dr-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:22px 22px 6px}
.dr-h h3{font-size:20px;margin-top:4px}
.dr-b{overflow-y:auto;padding:4px 22px 22px;flex:1}
.xbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);flex:none}
.li{border-bottom:1px solid var(--line);padding:10px 0}
.li .lnk{color:var(--violet);font-weight:500}
.li small{display:block;color:var(--muted);font-size:12px}
dl.rec{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin:12px 0}
dl.rec dt{color:var(--muted)} dl.rec dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:50;max-width:calc(100% - 32px)}

footer.credits{margin-top:44px;padding:20px 0 10px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer.credits a{color:inherit}

@media (max-width:800px){
  .levels{grid-template-columns:1fr 1fr;padding:16px 20px 22px}
  .twocol{grid-template-columns:1fr}
  .notes{grid-template-columns:1fr}
  .hero-text{padding:24px 20px}
  .starbig{right:20px;width:64px;height:64px}
  .pbar{grid-template-columns:110px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Modern skin: neutral canvas, brand gold as the emphasis, large tight type, post-it open questions,
   star-dotted wordmark with a tagline, soft tonal-wash background. */
body{font-size:14.5px;letter-spacing:-.005em}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.025em}
.brand h1{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.045em}
.card,.tile,.board,.rg,.qitem{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero{box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 48px -24px rgba(0,0,0,.18)}

/* post-it notes for open questions: the note colours stay the same in both themes, so their text uses --ink */
.note{background:var(--note-a);color:var(--ink);box-shadow:0 8px 16px rgba(0,0,0,.18);border-radius:3px}
.note:nth-child(3n+1){transform:rotate(-.6deg)}
.note:nth-child(3n+2){background:var(--note-b);transform:rotate(.5deg)}
.note:nth-child(3n){background:var(--note-c);transform:rotate(-.3deg)}

/* wordmark: dotless i topped with the North Star */
.wm{display:inline-block;font-weight:700;letter-spacing:-.03em}
.wm-i{position:relative;display:inline-block}
.wm-star{position:absolute;left:50%;top:.06em;width:.4em;height:.4em;transform:translateX(-50%);color:var(--star);filter:drop-shadow(0 0 .12em color-mix(in srgb,var(--star) 55%,transparent))}
.tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:10px}
.tag::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--star)}

/* background: soft tonal wash, no pattern */
html body{background-attachment:fixed;background-image:linear-gradient(135deg,rgba(255,255,255,.8),rgba(0,0,0,.025) 55%,rgba(0,0,0,.045))}
html[data-theme="dark"] body{background-image:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,0) 50%,rgba(0,0,0,.35))}
@media (prefers-color-scheme: dark){html:not([data-theme="light"]) body{background-image:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,0) 50%,rgba(0,0,0,.35))}}

</style>

  INITS.push(it); return it;
}

function rag(x){const k=[[142,55,40],[43,95,52],[3,78,50]],u=Math.max(0,Math.min(1,x)),i=u<=.5?0:1,t=u<=.5?u/.5:(u-.5)/.5,a=k[i],b=k[i+1],m=j=>Math.round((a[j]+(b[j]-a[j])*t)*10)/10;return `hsl(${m(0)} ${m(1)}% ${m(2)}%)`}

const nid={o:id=>"o:"+id,s:id=>"s:"+id,g:(s,g)=>"g:"+s+":"+(g||"none"),p:id=>"p:"+id,q:(s,g,o)=>"q:"+s+":"+(g||"none")+":"+(o||"none")};
function groupsOf(s){const m=new Map();initsOf(s.id).forEach(i=>{const k=(i.goal||"none")+"|"+(i.opp||"none");if(!m.has(k))m.set(k,{goal:i.goal,opp:i.opp,items:[]});m.get(k).items.push(i)});return [...m.values()]}
function edgesFor(s){
  const E=[];s.objs.forEach(o=>E.push([nid.o(o),nid.s(s.id)]));
  if(!state.open[s.id])return E;
  const gs=groupsOf(s), rowsG=[...s.goals.map(g=>g.id)]; if(gs.some(x=>!x.goal)||s.opps.some(o=>!o.goal))rowsG.push(null);
  rowsG.forEach(g=>{E.push([nid.s(s.id),nid.g(s.id,g)]);
    s.opps.filter(o=>o.goal===g).forEach(o=>E.push([nid.g(s.id,g),nid.p(o.id)]));
    gs.filter(x=>x.goal===g).forEach(x=>E.push([x.opp?nid.p(x.opp):nid.g(s.id,g),nid.q(s.id,g,x.opp)]))});
  return E;
}
function allEdges(){return STRATS.flatMap(edgesFor)}
function related(sel){
  if(!sel)return null; const E=allEdges(), set=new Set([sel]);
  const up=n=>E.filter(e=>e[1]===n).forEach(e=>{if(!set.has(e[0])){set.add(e[0]);up(e[0])}});
  const down=n=>E.filter(e=>e[0]===n).forEach(e=>{if(!set.has(e[1])){set.add(e[1]);down(e[1])}});
  if(sel.startsWith("o:")){down(sel);[...set].filter(n=>n.startsWith("s:")).forEach(n=>{const s=SBY[n.slice(2)];s.objs.forEach(o=>set.add(nid.o(o)))})}
  else{up(sel);down(sel)}
  return set;
}
function stratCard(s){
  const open=!!state.open[s.id];
  const succ=s.success?measureLine(s.success):s.outputOnly?`<small class="amb">No outcome measure · ${plural(s.goals.filter(g=>g.measures.some(m=>m.kind==="output")).length,"output measure")} only</small>`:`<small>Success measured through its goals</small>`;
  return `<div class="box strat ${s.status}" data-node="${nid.s(s.id)}" tabindex="0">
    <div class="strat-t"><button class="chev" type="button" data-toggle="${s.id}" aria-expanded="${open}" aria-label="${open?"Collapse":"Expand"} ${s.name}">${CHEV}</button><button class="lnk" type="button" data-rec="${nid.s(s.id)}">${s.id} ${s.name}</button></div>
    <small style="margin:4px 0 2px">${ST_LABEL[s.status]} · ${plural(s.goals.length,"goal")}</small>${succ}</div>`;
}

}

     <div class="ocol"><div class="colh"><b>Org objectives</b><small>why</small></div>${OBJECTIVES.map(o=>`<div class="box obj${cls(nid.o(o.id))}" data-node="${nid.o(o.id)}" tabindex="0"><b><button class="lnk" type="button" data-rec="${nid.o(o.id)}">${o.name}</button></b><small>${o.id}</small></div>`).join("")}</div>

   <details class="dstack"><summary>The Decision Stack in detail: what the record says, what the work shows, what people understand</summary>${dstackTable()}</details></div>`;
  return html.replace(/class="box ([^"]*)" data-node="([^"]+)"/g,(m,c,n)=>`class="box ${c}${c.includes(" dim")||c.includes(" sel")?"":cls(n)}" data-node="${n}"`);
}

function drawWires(){

     ${Q.map((_,k)=>{const f=activeIn(its,k,true),u=activeIn(its,k,false),d=tq.includes(k);return `<div class="qc"><b>${f}${u?` <span class="vio">+${u}</span>`:""}${d?' <i class="dia" title="Goal target this quarter"></i>':""}</b><span>${u?"initiatives · unfunded":"initiatives"}</span>${k===4&&later?`<span class="later">${later} later →</span>`:""}</div>`}).join("")}</div>`;

function fteTable(groups){

  return h+`</tbody></table><p class="hint">FTE per quarter in funded initiatives; <span class="vio">+n</span> is unfunded FTE on top. Click a group to list its initiatives.</p></div>`;
}

  if(id==="vision")return openDrawer("North Star · Org vision",VISION,"Owner: Org leadership · source: Org strategy (indicative)",`<p>The Org vision is the outcome the organisation exists to create. It is not yet measured, so the North Star level shows as not assessed.</p>`+recActions,push);
  if(k==="o"){const o=OBJECTIVES.find(x=>x.id===a),ss=STRATS.filter(s=>s.objs.includes(a));return openDrawer("Org objective · "+a,o.name,"Indicative description of this objective.",`<dl class="rec"><dt>Team strategies</dt><dd>${ss.map(s=>s.id+" "+s.name).join(", ")||"None"}</dd><dt>Status</dt><dd>Not assessed</dd></dl>`+recActions,push)}
  if(k==="s"){const s=SBY[a],its=initsOf(a);return openDrawer("Team strategy · "+a,s.name,`Q3 quarterly review: ${ST_LABEL[s.status]}`,`<dl class="rec"><dt>Serves</dt><dd>${s.objs.join(", ")}</dd><dt>Stated FTE</dt><dd>${s.stated}</dd><dt>FTE in initiatives</dt><dd>${fmt(r1(its.filter(i=>i.funded).reduce((x,i)=>x+avg27(i),0)))} (2027 average, funded)</dd><dt>Goals</dt><dd>${s.goals.map(g=>g.id).join(", ")}</dd><dt>Success measure</dt><dd>${s.success?esc(s.success.m)+" · by "+s.success.by:"Through its goals"}</dd><dt>Initiatives</dt><dd>${its.length} (${its.filter(i=>!i.goal).length} with no goal)</dd></dl>`+recActions,push)}
  if(k==="g"){const g=GBY[b];return openDrawer("Team goal · "+b,g.name,`Under ${a} ${SBY[a].name}`,`<dl class="rec"><dt>Measured</dt><dd>${g.measured?"Yes, a metric has a current value":"No current value"}</dd><dt>Measures</dt><dd>${g.measures.length?g.measures.map(m=>`${esc(m.m)} (${m.kind}${m.by?", by "+m.by:", no date"})`).join("<br>"):"None recorded"}</dd><dt>Initiatives</dt><dd>${INITS.filter(i=>i.goal===b).length}</dd></dl>`+recActions,push)}
  if(k==="p"){const o=OBY[a];return openDrawer("Opportunity · Proposed",o.name,`${o.goal?"Under goal "+o.goal:"Under "+o.strat+" (no goal yet)"}`,`<p>Indicative description of this item. Opportunities are proposed until an owner accepts, rewords or rejects them.</p>`+recActions,push)}
  if(k==="i"){const i=INITS.find(x=>x.id===a);return openDrawer("Initiative",i.name,`${i.funded?"Funded":"Unfunded"} · Workstream ${i.ws}`,`<dl class="rec"><dt>Strategy</dt><dd>${i.strat?i.strat+" "+SBY[i.strat].name:"Not linked"}</dd><dt>Goal</dt><dd>${i.goal||"No goal yet"}</dd><dt>Opportunity</dt><dd>${i.opp?i.opp+" (proposed)":"None"}</dd><dt>FTE by quarter</dt><dd class="mono">${Q.map((q,n)=>q+" "+fmt(i.q[n])).join(" · ")}</dd><dt>Beneficiary</dt><dd>${i.benef}</dd><dt>Discretion</dt><dd>${i.disc?"Discretionary":"Non-discretionary"} (suggested by rule)</dd><dt>Jira</dt><dd>${i.jira?`${i.jira.open} open epics, ${i.jira.unsized} unsized`:"No epic linked"}</dd><dt>Commitments</dt><dd>${i.com?i.com+(i.comRisk?" (at risk)":""):"None recorded"}</dd></dl>`+recActions,push)}
}
function openClaims(d){
  const doc=CLAIMDOCS.find(x=>x.id===d);
  openDrawer(`Claims · ${doc.n}`,`Source document ${d} (indicative)`,`${doc.kind} · ${doc.n} claims Proposed`,[...Array(doc.n)].map((_,k)=>`<div class="li"><b>Claim ${d}${k+1}: an indicative statement from the source</b><small>${k<doc.conflicts?'<span class="red">Conflicts with the record:</span> the record says something different':"Proposed · matches nothing in the record yet"}</small></div>`).join("")+`<p class="hint">An owner accepts or rejects each claim. Accepted claims update the record and are logged.</p>`);
}

/* ---------- flock ---------- */
let flockRun=0;
function initFlock(){
  const cv=$("#flock"); if(!cv)return; const run=++flockRun;
  const SK=window.SKIN||{}, ctx=cv.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1), score=flockScore(), reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  let W=1,H=1; const size=()=>{const r=cv.getBoundingClientRect();W=r.width||600;H=r.height||280;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}; size();
  const N=230,B=[]; for(let i=0;i<N;i++)B.push({x:W*.4+Math.random()*W*.2,y:H*.5+(Math.random()-.5)*H*.5,vx:1+Math.random(),vy:Math.random()-.5,p:Math.random()*6.28,g:Math.random()<.52?0:1,sp:.8+Math.random()*.4,wa:Math.random()*6.28});
  let t=0,color="#111"; const cvar=SK.colorVar||"--fg"; let SX=W-90,SY=56;
  const locStar=()=>{const s=document.querySelector(".starbig");if(!s)return;const r=s.getBoundingClientRect(),c=cv.getBoundingClientRect();SX=r.left+r.width/2-c.left;SY=r.top+r.height/2-c.top};locStar();
  window.onresize=()=>{size();locStar();if(state.view==="strategy")drawWires()};
  function step(){t++;
    const coh=.0006+.0078*score*score+.002*score, ali=.004+.085*score, sep=.55, wander=.2+.75*(1-score), pull=.0005+.0019*score;
    const lean=-.30+1.0*score, px=W*.45+Math.sin(t/310)*W*.15, py=H*.58+Math.sin(t/190+1)*H*.18;
    const ax=Math.max(W*.08,Math.min(W*.94,px+lean*(SX-px))), ay=Math.max(H*.1,Math.min(H*.85,py+lean*(SY-py)));
    const sw=Math.max(0,Math.sin(t/420)), split=Math.pow(sw,3)*.17*(.4+.6*score), bx=ax+Math.cos(t/520)*W*split, by=ay+Math.sin(t/520)*H*split*1.6, spd=1.4+.5*score;
    for(const b of B){const ds=[];for(const o of B){if(o===b)continue;const dx=o.x-b.x,dy=o.y-b.y;ds.push([dx*dx+dy*dy,o])}ds.sort((p,q)=>p[0]-q[0]);
      let cx=0,cy=0,vx=0,vy=0,sx=0,sy=0;for(let i=0;i<7;i++){const[d,o]=ds[i];cx+=o.x;cy+=o.y;vx+=o.vx;vy+=o.vy;if(d<300){const f=1-d/300;sx+=(b.x-o.x)*f;sy+=(b.y-o.y)*f}}
      cx/=7;cy/=7;vx/=7;vy/=7;b.vx+=(cx-b.x)*coh+(vx-b.vx)*ali+sx*sep*.012;b.vy+=(cy-b.y)*coh+(vy-b.vy)*ali+sy*sep*.012;
      const tx=b.g?bx:ax,ty=b.g?by:ay;b.vx+=(tx-b.x)*pull;b.vy+=(ty-b.y)*pull;b.wa+=(Math.random()-.5)*.25;b.vx+=Math.cos(b.wa)*wander*.1;b.vy+=Math.sin(b.wa)*wander*.1;
      const m=46;if(b.x<m)b.vx+=.24*(m-b.x)/m;if(b.x>W-26)b.vx-=.24*(b.x-(W-26))/m;if(b.y<m)b.vy+=.24*(m-b.y)/m;if(b.y>H-m-24)b.vy-=.24*(b.y-(H-m-24))/m;
      const sp=Math.hypot(b.vx,b.vy)||1,want=spd*b.sp,nsp=sp+(want-sp)*.12;b.vx*=nsp/sp;b.vy*=nsp/sp}
    for(const b of B){b.x+=b.vx;b.y+=b.vy}}
  function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=color;ctx.globalAlpha=SK.alpha||.85;
    for(const b of B){const a=Math.atan2(b.vy,b.vx),f=.55+.45*Math.sin(t*.35+b.p);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(a);ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-3.4*f);ctx.lineTo(-2,0);ctx.lineTo(-4,3.4*f);ctx.closePath();ctx.fill();ctx.restore()}ctx.globalAlpha=1}
  const getC=()=>getComputedStyle(document.documentElement).getPropertyValue(cvar).trim()||color;
  function loop(){if(run!==flockRun||!document.body.contains(cv))return;if(t%45===0)color=getC();step();draw();requestAnimationFrame(loop)}
  color=getC(); if(reduce){for(let i=0;i<500;i++)step();draw()}else loop();
}

/* ---------- routing and events ---------- */
const RENDER={overview:vOverview,strategy:vStrategy,work:vWork,decisions:vDecisions,questions:vQuestions,review:vReview};
function render(keepScroll){
  const y=scrollY; renderHeader(); $("#main").innerHTML=RENDER[state.view]();
  if(state.view==="overview")initFlock(); else flockRun++;
  if(state.view==="strategy")requestAnimationFrame(drawWires);
  if(keepScroll)scrollTo(0,y);
}
function route(){const h=location.hash.slice(1);const v=RENDER[h]?h:"overview";const changed=v!==state.view;state.view=v;if(changed)closeDrawer();render(!changed);if(changed)scrollTo(0,0)}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#drClose")||t.closest("#scrim"))return closeDrawer();
  if(t.closest("#drBack")){const p=state.drawerStack.pop();$("#drKicker").textContent=p[0];$("#drTitle").textContent=p[1];$("#drSub").innerHTML=p[2];$("#drBody").innerHTML=p[3];return}
  if(t.closest("#themeBtn")){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";if(state.view==="strategy")drawWires();return}
  const rec=t.closest("[data-rec]"); if(rec){e.stopPropagation();return openRec(rec.dataset.rec,!!rec.dataset.push)}
  const ls=t.closest("[data-list]"); if(ls)return openList(ls.dataset.list);
  if(t.closest("[data-contrib]"))return toast("Prototype: nothing is saved. In a live build this goes to the owner for review.");
  const tg=t.closest("[data-toggle]"); if(tg){state.open[tg.dataset.toggle]=!state.open[tg.dataset.toggle];return render(true)}
  if(t.closest("#expandAll")){const all=STRATS.every(s=>state.open[s.id]);STRATS.forEach(s=>state.open[s.id]=!all);return render(true)}
  const nd=t.closest(".board [data-node]"); if(nd&&!nd.classList.contains("zero")){state.sel=state.sel===nd.dataset.node?null:nd.dataset.node;return render(true)}
  const wv=t.closest("[data-wview]"); if(wv){state.work.view=wv.dataset.wview;state.work.open={};return render(true)}
  const wl=t.closest("[data-wlevel]"); if(wl){state.work.level=wl.dataset.wlevel;state.work.open={};return render(true)}
  const wo=t.closest("[data-wopen]"); if(wo){const id=wo.dataset.wopen;if(state.work.level!=="strategies"){state.work.level="strategies";state.work.open={};STRATS.forEach(s=>{if(s.id!==id)state.work.open[s.id]=true})}else state.work.open[id]=!state.work.open[id];return render(true)}
  const wg=t.closest("[data-wgrp]"); if(wg){const k="g"+wg.dataset.wgrp;state.work.open[k]=!state.work.open[k];return render(true)}
  if(t.closest("#resBtn")){state.work.research=!state.work.research;return render(true)}
  if(t.closest("#ndBtn")){state.showNonDisc=!state.showNonDisc;return render(true)}
  if(t.closest("#resetCh")){state.choice={};return render(true)}
  if(t.closest("#allQ")){state.allQ=!state.allQ;return render(true)}
  const cl=t.closest("[data-claims]"); if(cl)return openClaims(cl.dataset.claims);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#drawer").hidden)return closeDrawer();
  if((e.key==="Enter"||e.key===" ")&&e.target.matches(".board [data-node]")){e.preventDefault();e.target.click()}
});
document.addEventListener("change",e=>{const s=e.target.closest("[data-choice]");if(s){state.choice[s.dataset.choice]=s.value;render(true)}});
route();
</script>
