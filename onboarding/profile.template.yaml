# Starling: onboarding profile template
# template_version: 0.2.0
#
# One copy per client implementation, in the client's own repo (client/onboarding/profile.yaml).
# The generic package holds only this blank template.
#
# Shape: a short `technical` section that people answer, then a list of `claims` that are
# derived from the client's own material and confirmed or challenged by them.
#
# Conventions
#   - null = not yet asked or answered. Never guess a value to fill a gap.
#   - Role names, not personal names, in anything that may reach the generic package.
#     The client copy may use personal names; keep it private.
#   - Never record a secret, only where it is stored.

meta:
  template_version: "0.2.0"
  client_alias: null            # short non-identifying label
  started: null                 # YYYY-MM-DD
  interviewer: null             # role, e.g. "consultant"
  overall_status: not_started   # not_started | in_progress | ready_to_build | blocked
  scope_unit: null              # company | division | team
  sponsor_role: null            # who authorised the work
  day_to_day_contact_role: null

# ---------------------------------------------------------------------------
# technical: the questions people have to answer (the Ask phase)
# ---------------------------------------------------------------------------
technical:
  code:
    host: null                  # github | gitlab | azure_devops | bitbucket | other
    repo_location: null
    repo_visibility: null       # private | internal
    who_can_create_repos_role: null
  hosting:
    runtime_target: null        # internal_server | private_cloud | vpn_only_vm | desktop_only | other
    network_boundary: null
    authentication: null        # sso | basic_auth | network_only | other
    deployment_method: null
    admin_role: null
    approval_steps: []          # e.g. change board, security review, with typical lead time
  data_store:
    options_considered: []      # { type, pros, cons, verified: true|false }
    chosen: null                # google_sheets | excel_sharepoint | airtable | sql_database | other
    reason: null
    decided_by_role: null
    access_method: null         # api | export_import | manual
    credential_holder_role: null
    credential_storage: null    # where the secret lives, never the secret
    capabilities_needed:        # true | false | null (false = a gap, with a workaround below)
      multi_user_writes: null
      record_history_audit_trail: null
      many_to_many_links: null  # an initiative can serve several strategies
      field_level_permissions: null
      approval_step: null
      source_links: null
      size_limits_ok: null
    workarounds_for_gaps: []
  read_grant:                   # one grant, replaces per-document permission
    locations: []               # { location, kind: folder|system|tracker|connector, granted_by_role, date }
    exclusions: []              # places or kinds of document that must not be read
    redaction_rules: []         # e.g. names in transcripts
  privacy_and_model:
    data_must_stay_on_network: null
    model_provider_allowed: null
    model_hosting: null         # vendor_api | private_cloud_endpoint | self_hosted | none_allowed
    data_residency: null
    personal_data_in_sources: null
    transcript_consent_confirmed: null
    survey_min_group_size: null
    query_logging: null         # are users' questions stored, and for how long
  security_review:
    required: null
    owner_role: null
  access_to_page:
    viewers: null
    editors: null               # who may suggest changes or answer questions
    admin_role: null
  refresh:
    method: null                # manual_upload | scheduled_scan | event_driven | mixed
    schedule: null
    correction_route: null      # how a person flags wrong information
  assumptions: []               # { text, check_with_role }

# ---------------------------------------------------------------------------
# claims: everything else, derived from the client's material, then confirmed or challenged
# ---------------------------------------------------------------------------
# Each claim:
#   id: C001
#   field: <one of the field paths below>
#   value: ...                  # the proposed value; may be structured
#   origin: derived | stated | inferred
#   sources:                    # required when origin is derived; for inferred say what it was inferred from
#     - { source_id: S1, locator: "page, slide, tab or section", quote: "under 25 words" }
#   confidence: high | medium | low
#   status: proposed | confirmed | edited | rejected | unresolved
#   confirmed_by_role: null     # only the role-holder can confirm ownership claims
#   date: null
#   note: null                  # why edited or rejected; both quotes when sources conflict
#
# Field paths:
#   sources.inventory           # one claim per source: kind, owner role, tier, evidence role (said | done | understood)
#   scope.description
#   model.vision
#   model.principles
#   model.objectives            # id, name
#   model.strategies            # id, name, status, stated FTE, objectives served, success measure
#   model.goals                 # id, name, strategy, measures (name, outcome | output, target year or none)
#   model.opportunities         # id, name, strategy, goal (proposed until an owner accepts)
#   model.terminology           # client term -> stack tier
#   model.division_level        # whether a division or product-line level is needed, and which units
#   work.initiatives_source     # where initiatives live
#   work.initiatives            # id, name, links [strategy, goal, opportunity], FTE by quarter, funded, split
#   work.unlinked               # initiatives with no strategy, from the cross-check
#   work.effort_unit            # default fte
#   work.link_method            # tag_or_field | parent_child | set_in_onboarding | edited_in_tool
#   work.confidence_scale       # default low | medium | validated
#   roles.owner                 # per area: owner, approver, decision maker (roles)
#   cadence.horizon
#   cadence.review
#   cadence.decision_points
claims: []

# ---------------------------------------------------------------------------
# Coverage: what the material cannot show
# ---------------------------------------------------------------------------
coverage_gaps: []               # { tier, gap: no_source | said_only | no_done_evidence | no_understood_evidence | owner_unknown }

# ---------------------------------------------------------------------------
# open_items: rejected, unresolved and "ask someone else" items. These seed the page's
# Open questions and Review tabs.
# ---------------------------------------------------------------------------
open_items: []                  # { claim_id, question, owner_role, needed_by }

# ---------------------------------------------------------------------------
# readiness and hand-off
# ---------------------------------------------------------------------------
readiness:
  claims_by_status:             # counted per section when onboarding finishes
    confirmed: null
    edited: null
    rejected: null
    unresolved: null
    proposed: null
  can_build_first_version: null # true only when hosting and data store are decided, the read grant exists,
                                # one strategy source and one "done" source have been read, and no blocker is on the critical path
  blockers: []                  # { item, owner_role, needed_by }
  first_version_scope: null
  deferred_to_later: []
  draft_data_file: null         # client/data/draft.json, in the shape of docs/DATA_MODEL.md
  next_review_date: null

# ---------------------------------------------------------------------------
# template_feedback: non-identifying notes for improving the generic package
# ---------------------------------------------------------------------------
template_feedback:
  missing_fields: []
  confusing_fields: []
  fields_never_used: []
  client_specific_items_to_exclude_from_generic: []
