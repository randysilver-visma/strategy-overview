    principles: null
    strategy: null
    objectives: null
    division_level_needed: null # true if product-line or division strategy must sit between objectives and work
    division_units: []          # names of divisions or product lines
  default_schema_used: true     # Strategy Mirror model is the default (consultant, 4.1)
  planning_horizon: null        # e.g. "annual objectives, quarterly reviews"
  review_cadence: null
  decision_points_defined: null # do milestones and triggers exist anywhere in the source material?
  terminology_differences:      # client term -> package term
    - client: "Objective / Key result (OKR)"
      package: "varies by document (4.2): sometimes team goal + outcome measure, sometimes team strategy + goals, sometimes Org objective"
      action: "Map per document when the competing strategy docs are listed; flag documents that use OKR levels inconsistently as a finding"
