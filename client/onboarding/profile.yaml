# Strategy Mirror: onboarding profile (client copy, private to this repo)
# template_version: 0.1.0
#
# One copy of this file per client implementation, stored in the client's own repo
# (client/onboarding/profile.yaml). The generic package contains only this blank template.
#
# Conventions
#   - null            = not yet asked or not yet answered. Never guess a value to fill a gap.
#   - status          = per section: not_started | in_progress | complete | blocked
#   - assumptions     = anything the interviewer inferred rather than was told. Each needs a
#                       "check_with" (a named role) and stays here until confirmed.
#   - Values marked "one of:" accept only those options, or "other" plus a note.
#   - Role names, not personal names, in anything that may reach the generic package.
#     The client copy may use personal names; keep it private.

meta:
  template_version: "0.1.0"
  client_alias: "client-a"      # short non-identifying label, e.g. "client-a"
  started: "2026-11-16"         # YYYY-MM-DD
  interviewer: "consultant"     # role, e.g. "consultant"; Claude runs the interview with them
  client_sponsor_role: "Product Lead, Agentic Experience"   # who authorised the work
  client_sponsor_name: "Tobias Jensen"   # client copy only; never copy into the generic package
  client_sponsor_confirmed: false        # stated by the consultant; not yet confirmed by the sponsor
  day_to_day_contact_role: "consultant"  # field added; see template_feedback
  scope_assumptions:
    - item: "The consultant can answer for AX day to day; questions only AX staff can answer (owners, permissions, data access) are routed through the sponsor."
      check_with: "Product Lead, Agentic Experience"
  overall_status: in_progress   # not_started | in_progress | ready_to_build | blocked
  scope_unit: team             # one of: company | division | team
  scope_description: "The Agentic Experience (AX) team. Company-level goals may be needed as context above the team, but the first version focuses on AX."
  scope_notes:
    - "Org vision and Org objectives sit above AX as context (the North Star and Org objectives tiers). Whether they are in scope as content or only as links is to be settled in section 4."
  environment_check:            # what the interviewer's environment reached on 2026-11-16, by trying it
    confirmed:
      - "GitHub: push access to this repository"
      - "Slite: connected to the client's workspace (identity call only)"
      - "Google Drive: shared drives listable (metadata only, no files opened)"
    unverified:
      - "Google Docs, Sheets, Slides: connected; not tried because it needs a file ID [UNVERIFIED]"
      - "Meetings: connected; not tried [UNVERIFIED]"
    not_found: ["Jira", "Airtable", "Excel/SharePoint"]   # no connector in this environment

# ---------------------------------------------------------------------------
# 1. Hosting: where the code and the running page live
# ---------------------------------------------------------------------------
hosting:
  status: in_progress
  code_host: null               # one of: github | gitlab | azure_devops | bitbucket | other
  code_host_pending:
    question: "Stay in randysilver-visma/strategy-overview (personal account) or move to an e-conomic/Visma organisation or another host?"
    asked_of: "the consultant's tech contact (role not yet recorded)"
    asked_on: "2026-11-16"
    current_state: "Code is in randysilver-visma/strategy-overview on GitHub"
  approvals_pending:
    question: "Does going live need a security or privacy review, an architecture or change board, or sign-off for AI use on internal documents? Who runs each?"
    asked_of: "the consultant's tech contact (role not yet recorded)"
    status: "to ask"
  code_host_default_used: null  # true if GitHub chosen because no alternative exists
  repo_location: null           # org/repo path once created
  repo_visibility: null         # one of: private | internal
  who_can_create_repos_role: null
  runtime_target: other         # PROVISIONAL: "on GitHub, if possible" (e.g. GitHub Pages). To be confirmed by the tech contact.
  network_boundary: "Reachable from anywhere for any e-conomic/Visma employee who signs in with company SSO (consultant's belief; may narrow to a named group)"
  authentication: sso           # one of: sso | basic_auth | network_only | other
  deployment_method: "PROVISIONAL: from GitHub (e.g. a GitHub Actions build), to be confirmed by the tech contact"
  admin_role: null              # who keeps it running; to ask the tech contact
  constraints: []               # free text, e.g. "no external CDNs", "change board approval needed"
  assumptions:
    - item: "Audience is all e-conomic/Visma employees via SSO. May change to a named group (AX and its stakeholders) behind SSO."
      check_with: "Product Lead, Agentic Experience; the consultant's tech contact"
    - item: "[UNVERIFIED] Hosting on GitHub Pages behind company SSO likely needs GitHub Enterprise Cloud with private Pages publishing. Could not check docs.github.com from this environment."
      check_with: "the consultant's tech contact"
    - item: "b-on-GitHub needs every contributor and approver to have a GitHub account with repo access; viewers would not. The consultant believes everyone who might make a change already has GitHub access."
      check_with: "Product Lead, Agentic Experience; the consultant's tech contact"
    - item: "[UNVERIFIED] GitHub Pages serves static files only. Saving edits, approvals and decisions would then need the data store (section 2) to accept writes directly from the page, or a separate small backend."
      check_with: "the consultant's tech contact"

# ---------------------------------------------------------------------------
# 2. Data store: the single source of truth for records and edits
# ---------------------------------------------------------------------------
data_store:
  status: complete              # answers recorded; setup choice provisional until hosting is settled
  candidates_in_use: ["slite"]  # 2.1: the consultant named Slite only, "if possible"
  options_considered:           # list of { type, why_considered, pros, cons, verified: true|false }
    - type: slite
      why_considered: "Already used at e-conomic; the consultant's preferred option. Connected in the interview environment."
      pros:
        - "Collections: structured docs with typed columns, one sub-doc per row (seen in the connector's tools)"
        - "Doc review states (Verified, Outdated, Verification requested) and comment threads (seen in the connector's tools)"
        - "Docs can hold links and uploaded files (seen in the connector's tools)"
      cons:
        - "Links between collections work, including many-to-many, but read back only as a comma-separated string of titles, with no ids (tested 2026-11-16)"
        - "No record of who changed a cell. Rows carry lastEditedAt but no editor; owner is the creator. No history of values (tested 2026-11-16)"
        - "[UNVERIFIED] Permissions appear to be per channel or doc, not per field"
        - "A static page cannot hold a Slite API key safely, so the page cannot read or write Slite live without a backend or a scheduled export"
      verified: partial
      verification_note: "Docs unreachable from the interview environment (slite.com, developers.slite.com). Capability test run by the consultant in a claude.ai chat via the Slite connector on 2026-11-16: two test collections, notes-column links, number and select writes, read-back, archive. Results recorded under capabilities_needed."
      test_results:
        links_across_collections: "Yes. A notes column takes row ids, comma-separated, on write."
        many_to_many: "Yes. One row linked to two rows."
        link_read_back: "Partly. Returns titles only (\"Goal A, Goal B\"), no ids. Duplicate titles or titles with commas would be ambiguous. sliteml, md and html exports don't show the links."
        number_and_select: "Yes. Values come back as strings (\"1.5\"). Writing a new select value creates the option."
        empty_cells: "Unset cells are left out of fields entirely, not returned as false or null."
        edit_history: "No per-cell history or editor. Rows have lastEditedAt only; the parent collection's lastEditedAt doesn't change on a row edit; list-recently-edited-notes returned nothing."
        archive: "Archive hides rows and collections; they stay readable with includeArchivedRows. No delete tool."
        not_tested: ["permanent deletion", "Slite app version history", "querying by link (needs reading every row)", "todo column writes", "concurrent edits", "field-level permissions", "size limits"]
      cleanup_needed: "Six archived test docs (two collections, four rows) from 2026-11-16 to delete in the Slite UI if not wanted. Two older docs, \"[TEST] Strategy Mirror spike: Initiatives\" and \"... Objectives\" (2026-11-11), are in the consultant's personal channel; not created or touched by this interview."
  chosen:
    type: other                 # one of: google_sheets | excel_sharepoint | airtable | sql_database | other  -> Slite
    reason: "Slite is already used at e-conomic and was tested. Preferred setup: Slite plus a small backend that writes a Changes log (option b), because Slite keeps no record of who changed a cell. Fallback: Slite plus a scheduled snapshot (option a) with a team rule that records change only through a Changes collection."
    setup_preference: ["b: Slite + hosted backend writing a Changes log", "b-on-GitHub: changes as pull requests, approved by merge, a GitHub Action writes to Slite", "a: Slite + scheduled snapshot + Changes-collection rule"]
    decided_by_role: "consultant"
    decision_status: provisional   # depends on hosting (section 1) and the tech contact
    decision_date: "2026-11-16"
  access:
    method: api                 # one of: api | export_import | manual
    credential_holder_role: "the consultant's tech contact or e-conomic IT (role to be named)"
    credential_storage: null    # where secrets live. Never record the secret itself. To decide with the credential holder (e.g. a GitHub repo secret for b-on-GitHub).
  capabilities_needed:          # fill true/false once the chosen store is known; false = a gap
    multi_user_writes: null           # writes via the connector work; concurrent editing not tested
    record_history_audit_trail: false # tested: no editor or value history per cell; lastEditedAt per row only
    relational_links: true      # initiative <-> objective is many-to-many. Tested: works, but reads back titles only, not ids
    field_level_permissions: null     # [UNVERIFIED] likely false: channel/doc permissions only
    approval_workflow_support: null   # partial: doc-level review states and comments, not per-change approval
    attachments_or_source_links: true # links and file uploads exposed by the connector
    row_or_size_limits_ok: null       # [UNVERIFIED] limits unknown
  workarounds_for_gaps:         # how each false capability is handled (proposed; not yet agreed)
    - gap: "Links read back as titles, not ids"
      workaround: "Give every row a unique short id in its title (e.g. \"S1 Strategy 1\", \"I84 Initiative 84\") and forbid commas in titles; the build matches links on that id."
    - gap: "No record of who changed what"
      workaround: "Keep a separate Changes collection (who proposed, who approved, before, after, date) and only change records through it. Edits made directly in Slite would bypass it."
  backup_and_recovery: "If hosted on GitHub: every snapshot or change is committed to the repo, which is the off-Slite copy. Otherwise: Slite's own version history and archive. The consultant judges the tool not business-critical for now."
  criticality: "not business-critical (consultant, 2026-11-16)"
  assumptions: []

# ---------------------------------------------------------------------------
# 3. Information sources: what gets ingested, from where, with what permission
# ---------------------------------------------------------------------------
information_sources:
  status: in_progress
  ingestion_principles_confirmed: null   # true once sponsor agrees: nothing is read before permission is recorded
  landscape: "Much strategy documentation in Slite and in Google Docs/Slides. How well it agrees is unknown, which is part of what the tool should show. (consultant, 3.1)"
  sources:
    - id: S1
      name: "AX work in Jira (epics, issues)"
      kind: work_tracker
      location: "Jira (project or board not yet named)"
      access_route: null          # no Jira connector in the interview environment; export or API to decide
      owner_role: "Engineering Lead, Agentic Experience"   # assumed owner as the permission holder; to confirm
      owner_name: "Paul"          # client copy only
      decision_stack_tier: work
      evidence_role: done
      permission_status: pending  # waiting on the Engineering Lead
      permission_granted_by_role: null   # set to "Engineering Lead, Agentic Experience" once Paul grants it
      permission_to_ask_of: "Engineering Lead, Agentic Experience (Paul)"
      permission_note: "Decided in 3.5 that the Engineering Lead grants Jira read access, not the consultant. Ask covers which project(s), which fields (titles, comments, assignees), and who may see them on the page."
      sensitivity: general        # PROVISIONAL: consultant believes general; to confirm with the owner
      redaction_needed: null
      scan_frequency: on_change   # ideal (3.9). Needs a backend or webhook; if setup a (snapshot) is used, a fallback frequency is still to agree
      retention: null
      known_quality_issues: null
    - id: S2
      name: "AX roadmap or initiative list in Slite"
      kind: other                 # roadmap / initiative list
      location: "https://e-conomic.slite.com/app/docs/t7Se-7EoMUOlmM"   # more Slite pages to be added later
      access_route: connector     # Slite connector confirmed in the interview environment
      owner_role: "Product Lead, Agentic Experience"
      decision_stack_tier: work
      evidence_role: said         # a plan states intent; "done" evidence comes from Jira. To confirm.
      permission_status: granted
      permission_granted_by_role: "consultant"
      permission_granted_on: "2026-11-16"
      permission_note: "Granted by the consultant in 3.6 for this doc; the owner is the Product Lead. Further pages need their own permission entry. Not opened during onboarding."
      sensitivity: general        # PROVISIONAL: consultant believes general; to confirm with the owner
      redaction_needed: null
      scan_frequency: on_change   # ideal (3.9). Needs a backend or webhook; if setup a (snapshot) is used, a fallback frequency is still to agree
      retention: null
      known_quality_issues: null
  # Each entry:
  # - id: S1
  #   name: null
  #   kind: null                  # one of: strategy_doc | report | spreadsheet | transcript | metrics | survey | work_tracker | other
  #   location: null              # drive/folder path, URL, or system name
  #   access_route: null          # one of: upload | folder_scan | connector | export
  #   owner_role: null
  #   decision_stack_tier: null   # one of: vision | principles | strategy | objectives | division | work | cross_cutting
  #   evidence_role: null         # one of: said | done | understood
  #   permission_status: null     # one of: granted | pending | denied
  #   permission_granted_by_role: null
  #   sensitivity: null           # one of: general | confidential | restricted
  #   redaction_needed: null      # e.g. names in transcripts
  #   scan_frequency: null        # one of: manual | daily | weekly | monthly | on_change
  #   retention: null
  #   known_quality_issues: null
    - id: S3
      name: "Strategy review meetings: slide decks, plus related notes in Slite"
      kind: other                 # review decks and meeting notes
      location: "Google Slides / Google Drive, and Slite (specific decks and pages not yet named)"
      access_route: connector     # Google Drive and Slite connectors confirmed; Slides connector connected but untested
      owner_role: null
      decision_stack_tier: cross_cutting
      evidence_role: understood   # mixed: leadership slides state the strategy ("said"); team slides show how teams read it ("understood")
      prepared_by: "Teams and leadership, contributing at different levels (3.11)"
      scope_rule: "Published decks and pages only; drafts and unpublished material are excluded"
      note: "When ingested, tag each slide or section by who prepared it, so leadership content counts as said and team content as understood."
      permission_status: granted
      permission_granted_by_role: "consultant"
      permission_granted_on: "2026-11-16"
      permission_note: "Basis: published review decks and pages are open to employees by default (consultant, 3.12). Covers published material only."
      sensitivity: general        # published = open by default; to confirm with the Product Lead
      redaction_needed: null
      scan_frequency: null
      retention: null
      known_quality_issues: null
  pending_sources:
    - what: "Several competing AX strategy documents (Slite and Google Docs/Slides); no single one is current"
      evidence_role: said
      status: "to be listed later by the consultant"
  assumptions:
    - item: "S1 (Jira) and S2 (Slite roadmap) are general: fine for any e-conomic/Visma employee."
      check_with: "Engineering Lead, Agentic Experience (S1); Product Lead, Agentic Experience (S2)"
  gaps_in_coverage:
    - "Vision and Org objectives: no source named yet (expected among the competing strategy documents)"
    - "Strategy and goals: only 'said' sources so far (competing docs, roadmap); Jira gives 'done' only at work level, and Jira permission is still pending"
    - "No source of 'understood' evidence below leadership other than team slides in review decks"
    - "The competing strategy documents are not yet listed, so no owner or permission is recorded for them"          # tiers with no source, or only "said" evidence and no "done" evidence

