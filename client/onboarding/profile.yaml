# ---------------------------------------------------------------------------
# Coverage: what the material cannot show (before import)
# ---------------------------------------------------------------------------
coverage_gaps:
  - {tier: vision, gap: no_source}
  - {tier: objectives, gap: no_source}
  - {tier: strategy, gap: said_only}
  - {tier: work, gap: no_done_evidence, note: "Jira read permission pending"}
  - {tier: all, gap: no_understood_evidence, note: "only team slides in review decks"}

# ---------------------------------------------------------------------------
# open_items: seed the page's Review tab
# ---------------------------------------------------------------------------
open_items:
  - {claim_id: C001, question: "Grant Jira read access: which projects and fields?", reviewer_role: "Engineering Lead, Agentic Experience", needed_by: "before 'done' evidence"}
  - {claim_id: C004, question: "List the competing strategy documents, or grant the spaces and folders that hold them", reviewer_role: "consultant", needed_by: "before import"}
  - {claim_id: C015, question: "Governance team: name, members, meeting rhythm", reviewer_role: "consultant", needed_by: null}
  - {claim_id: C016, question: "Planning horizon and review cadence", reviewer_role: "Product Lead, Agentic Experience", needed_by: null}

# ---------------------------------------------------------------------------
# readiness and hand-off
# ---------------------------------------------------------------------------
readiness:
  claims_imported: {stated_in_interview: 18, derived_from_sources: 0}
  claims_flagged: {conflict: 1, low_confidence: 0, single_source: 5, stale: 0, no_owner: 1, unclear: 7}
  claims_reviewed: 0
  can_build_first_version: false
  reason: "Hosting and the data-store setup are provisional, the read grant is partial, and nothing has been imported from sources yet."
  blockers:
    - {item: "Code host and hosting (GitHub Pages behind SSO; who keeps it running)", owner_role: "tech contact", needed_by: "before the first build"}
    - {item: "Approvals before going live", owner_role: "tech contact", needed_by: "before opening the page beyond the consultant"}
    - {item: "Slite and Claude API keys: holder and storage", owner_role: "tech contact or IT", needed_by: "before the first build"}
    - {item: "Read grant: competing strategy documents and further Slite pages", owner_role: "consultant", needed_by: "before import"}
    - {item: "Jira read permission", owner_role: "Engineering Lead, Agentic Experience", needed_by: "before 'done' evidence"}
  next_step: "Phase 2 import from the granted sources (AX roadmap in Slite, published review decks) into claims, then claims_to_data.py to a draft page"
  first_version_scope: "AX only. Best guesses from the Slite roadmap, published review decks and the strategy documents once granted, each flagged where unsure. Changes and challenges proposed as pull requests."
  deferred_to_later: ["Jira 'done' evidence until permission", "e-conomic/Visma branding", "live chat model (the page's chat answers from page data only)", "approval deadlines beyond the page's 7-day overdue marker"]
  draft_data_file: null         # client/data/draft.json once imported
  next_review_date: "2026-11-17"  # tech questions with the tech contact

template_feedback:
  missing_fields:
    - "meta.environment_check: where to record which tools the onboarding could reach"
    - "technical.code: no field for a pending move between repos"
    - "technical.read_grant.to_add: grants that are expected but not yet given"
    - "technical.refresh.notification_channel and challenge_days (used by the page, no template field)"
  confusing_fields:
    - "work.confidence_scale: template default (low | medium | validated) differs from the page's (hypothesis | partly validated | validated)"
  fields_never_used: []
  client_specific_items_to_exclude_from_generic: []
  process_feedback:
    - "0.1.0 asked too much that documents can answer. The consultant asked for derive-and-propose with the interview kept to tech setup. 0.2.0 does this."
    - "Approving connector write tools from a cloud session fails; plan for capability tests in a claude.ai chat."
