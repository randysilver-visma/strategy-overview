# Strategy Mirror: onboarding profile for AX (client copy, private to this repo)
# template_version: 0.2.0
#
# Migrated on 2026-11-17 from the 0.1.0 interview of 2026-11-16 (kept in archive/profile-0.1.0.yaml).
# Shape: `technical` holds what people had to answer; `claims` holds everything else as best guesses.
# Answers the consultant gave about the model, work and roles are claims with origin "stated":
# shown as best guesses and left unreviewed until the owner named in reviewer_role confirms them.
#
# Conventions
#   - null = not yet asked or answered. Never guess a value to fill a gap.
#   - Role names, not personal names, in anything that may reach the generic package.
#     This client copy uses some personal names; keep it private.
#   - Never record a secret, only where it is stored.

meta:
  template_version: "0.2.0"
  client_alias: "client-a"
  started: "2026-11-16"
  migrated_from: "0.1.0 (archive/profile-0.1.0.yaml), 2026-11-17"
  interviewer: "consultant"     # Claude runs the onboarding with the consultant
  overall_status: in_progress   # not_started | in_progress | ready_to_build | blocked
  scope_unit: team
  sponsor_role: "Product Lead, Agentic Experience"
  sponsor_name: "Tobias Jensen"           # client copy only
  sponsor_confirmed: false                # stated by the consultant; the sponsor has not confirmed
  day_to_day_contact_role: "consultant"   # AX-only questions go through the sponsor (assumption below)
  product_name: "Strategy Mirror"         # the e-conomic instance's name (skin config "product")
  environment_check:            # what the onboarding environment reached, by trying it
    confirmed:
      - "GitHub: push access to this repository (2026-11-16)"
      - "Slite: connected to the client's workspace; identity call and a capability test in a claude.ai chat (2026-11-16)"
      - "Google Drive: shared drives listable, metadata only (2026-11-16)"
      - "Google Drive: created the tech-questions doc (2026-11-16)"
    unverified:
      - "Google Docs, Sheets, Slides: connected; no client file opened [UNVERIFIED]"
      - "Meetings: connected; not tried [UNVERIFIED]"
      - "Atlassian (Jira, Confluence): connector appeared 2026-11-17; not tried, because Jira read permission is pending [UNVERIFIED]"
    not_found: ["Airtable", "Excel/SharePoint"]
    blocked:
      - "Slite write tools: approvals for 'needs approval' tools are cancelled in this cloud session; use a claude.ai chat for Slite writes"
      - "slite.com, developers.slite.com, docs.github.com: not reachable from this environment's network policy"

# ---------------------------------------------------------------------------
# technical: the questions people have to answer (the Ask phase)
# ---------------------------------------------------------------------------
technical:
  scope:
    description: "The Agentic Experience (AX) team. Org vision and Org objectives sit above it as context."
  code:
    host: github                # current; whether it stays is pending
    repo_location: "randysilver-visma/strategy-overview (personal account)"
    repo_visibility: null
    who_can_create_repos_role: null
    pending: "Stay in the personal repo or move to an e-conomic/Visma organisation (tech contact; tech-questions doc Q1)"
  hosting:
    runtime_target: other       # PROVISIONAL: "on GitHub, if possible", e.g. GitHub Pages
    network_boundary: "Any e-conomic/Visma employee via company SSO, from anywhere (consultant's belief; may narrow to AX and stakeholders)"
    authentication: sso
    deployment_method: "PROVISIONAL: from GitHub, e.g. a GitHub Actions build"
    admin_role: null            # who keeps it running: tech contact (Q6)
    approval_steps: []          # pending: security, privacy, architecture, AI use (tech contact, Q4)
  data_store:
    options_considered:
      - type: slite
        pros:
          - "Already used at e-conomic"
          - "Collections with typed columns; many-to-many links between collections work (tested 2026-11-16)"
          - "Doc review states and comment threads; links and file uploads"
        cons:
          - "Links read back as titles only, no ids (tested)"
          - "No record of who changed a cell; rows have lastEditedAt only (tested)"
          - "[UNVERIFIED] Permissions per channel or doc, not per field"
          - "A static page cannot hold a Slite API key, so live reads and writes need a backend or GitHub Actions"
        verified: partial
        test: "Run by the consultant in a claude.ai chat via the Slite connector, 2026-11-16; full results in archive/profile-0.1.0.yaml"
    chosen: other               # Slite
    setup_preference:
      - "1. Slite plus a small backend that writes a change log"
      - "2. On GitHub: suggested changes as pull requests, approved by merge, a GitHub Action writes to Slite"
      - "3. Fallback: scheduled snapshot plus a 'change through the Changes collection' rule"
    reason: "Slite is already in use and was tested. It keeps no record of who changed what, so changes should go through a log."
    decided_by_role: "consultant"
    decision_status: provisional   # depends on hosting
    access_method: api
    credential_holder_role: "the consultant's tech contact or e-conomic IT (role to be named)"
    credential_storage: null    # e.g. a GitHub repository secret (tech contact, Q5)
    capabilities_needed:
      multi_user_writes: null           # writes work; concurrent edits not tested
      record_history_audit_trail: false # tested
      many_to_many_links: true          # tested; titles only on read-back
      field_level_permissions: null     # [UNVERIFIED] likely false
      approval_step: null               # partial: doc-level review states only
      source_links: true
      size_limits_ok: null              # [UNVERIFIED]
    workarounds_for_gaps:
      - gap: "Links read back as titles, not ids"
        workaround: "Every row title starts with a short unique id (e.g. \"S1 Strategy 1\"); no commas in titles; the build matches on the id."
      - gap: "No record of who changed what"
        workaround: "Changes go through pull requests (setup 2) or a Changes collection (setup 3). Direct edits in Slite bypass the log."
    backup: "Git history if hosted on GitHub; otherwise Slite's own history and archive. Not business-critical."
    cleanup_needed: "Six archived Slite test docs from 2026-11-16 to delete in the Slite UI; two older '[TEST] Strategy Mirror spike' docs (2026-11-11) in the consultant's personal channel."
  read_grant:                   # one grant, replaces per-document permission (new in 0.2.0)
    status: partial             # the full grant (locations, exclusions, grantor) is still to agree
    locations:
      - location: "https://e-conomic.slite.com/app/docs/t7Se-7EoMUOlmM (AX roadmap)"
        kind: connector
        granted_by_role: "consultant"
        date: "2026-11-16"
        owner_role: "Product Lead, Agentic Experience"
      - location: "Published strategy review decks and pages (Google Slides/Drive and Slite)"
        kind: connector
        granted_by_role: "consultant"
        date: "2026-11-16"
        basis: "Published material is open to employees by default"
      - location: "AX Jira project(s)"
        kind: tracker
        granted_by_role: null   # pending: Engineering Lead, Agentic Experience (Paul)
        date: null
        note: "Ask covers which projects, which fields (titles, comments, assignees) and who may see them"
    to_add:
      - "The competing AX strategy documents in Slite and Google Docs/Slides (consultant to list, or grant whole spaces/folders)"
      - "Further AX Slite pages (consultant)"
    exclusions:
      - "Unpublished drafts of review decks and pages"
    redaction_rules: []         # names are shown for now (privacy below)
  privacy_and_model:
    data_must_stay_on_network: false   # derived from GitHub hosting; tech contact to confirm
    model_provider_allowed: "Anthropic Claude, through the company's Claude account"
    model_hosting: vendor_api   # an API key under the company's Anthropic organisation needs checking (Q5)
    data_residency: null        # tech contact (Q7)
    personal_data_in_sources: true
    show_names_on_page: "yes, for now (consultant)"
    transcript_consent_confirmed: null   # not applicable: no transcripts among sources
    survey_min_group_size: null          # not applicable: no surveys
    query_logging: null         # the chat (Ask Strategy Mirror) is back in the design; decide if questions are logged
  security_review:
    required: null              # tech contact (Q4)
    owner_role: null
  access_to_page:
    viewers: "any e-conomic/Visma employee via SSO; may narrow to AX and stakeholders (provisional)"
    editors: "people with GitHub access to the repo, proposing changes as pull requests (provisional)"
    admin_role: "consultant during the pilot; hand over to AX later"
  refresh:
    method: event_driven        # ideal; needs a backend, webhooks or Actions. Fallback schedule to agree for setup 3
    schedule: null
    correction_route: "Challenge or suggest from the page; becomes a pull request reviewed by the item's owner"
    notification_channel: "Private Slack channel for AX (consultant to create)"
    challenge_days: null        # the page defaults to 7 days before a challenge is overdue (assumption to confirm)
  assumptions:
    - text: "Questions only AX staff can answer go through the sponsor."
      check_with_role: "Product Lead, Agentic Experience"
    - text: "Everyone who would suggest or approve a change has GitHub access."
      check_with_role: "Product Lead, Agentic Experience; tech contact"
    - text: "[UNVERIFIED] GitHub Pages behind company SSO needs GitHub Enterprise Cloud with private Pages."
      check_with_role: "tech contact"
    - text: "[UNVERIFIED] GitHub Pages serves static files only."
      check_with_role: "tech contact"
  tech_questions_doc: "https://docs.google.com/document/d/1s5hP45qgyAerAsfk6HH1LvR8Bvx0lS3Fh9Q3R2eLCX4/edit"

